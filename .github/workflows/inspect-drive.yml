name: Inspect supplied file
on:
  push:
    branches: ['arena/8bed749a-gasser-and-amr']
    paths: ['.github/workflows/inspect-drive.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download the shared file
        run: |
          python -m pip install --disable-pip-version-check 'gdown==5.2.0'
          mkdir -p incoming
          gdown 'https://drive.google.com/uc?id=1mGjvzd_CIAwLc-Z69IZi0rmWDRxoVGU_' -O incoming/supplied-file
          test -s incoming/supplied-file
          test "$(stat -c %s incoming/supplied-file)" -le 52428800
          file incoming/supplied-file
          ls -lh incoming/supplied-file
      - name: Save supplied file on the current branch
        run: |
          mkdir -p supplied
          cp incoming/supplied-file supplied/supplied-file
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supplied/supplied-file
          if ! git diff --cached --quiet; then
            git commit -m 'Add supplied file for inspection'
            git push origin HEAD:refs/heads/arena/8bed749a-gasser-and-amr
          fi
      - name: Upload file for inspection
        uses: actions/upload-artifact@v4
        with:
          name: supplied-file
          path: incoming/supplied-file
          retention-days: 1
          if-no-files-found: error
